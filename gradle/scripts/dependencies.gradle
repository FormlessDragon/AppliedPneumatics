apply from: 'gradle/scripts/helpers.gradle'

repositories {
    maven {
        name = 'CleanroomMC'
        url = 'https://maven.cleanroommc.com'
    }
    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
    }
    maven {
        name = 'CleanroomCurseMaven'
        url = 'https://curse.cleanroommc.com'
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
    }
    mavenCentral()
    mavenLocal()
}

dependencies {
    compileOnly 'com.cleanroommc:sponge-mixin:0.20.13+mixin.0.8.7'
    if (propertyBool('enable_lwjglx')) {
        compileOnly 'com.cleanroommc:lwjglx:1.0.0'
    }

    compileOnly("io.github.formlessdragon:AppliedEnergistics2-Supergiant:${ae2_version}:dev")
    modRuntimeOnly("io.github.formlessdragon:AppliedEnergistics2-Supergiant:${ae2_version}:dev") {
        transitive = false
    }

    modCompileOnly "curse.maven:baubles-227083:2518667"
    testRuntimeOnly "curse.maven:baubles-227083:2518667"
    modImplementation "curse.maven:pneumaticcraft-repressurized-281849:${pneumaticcraft_version}"
    modImplementation "curse.maven:mouse-tweaks-unofficial-461660:5876158"
}
